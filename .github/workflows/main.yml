name: Build Kinemium Engine
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86-64
            os: windows-latest
            folder: windows_x86-64
            executable: kinemium.exe
            template_os: windows
            template_arch: x86_64
            template_ext: .exe
          - name: Linux x86-64
            os: ubuntu-24.04
            folder: linux_x86-64
            executable: kinemium
            template_os: linux
            template_arch: x86_64
            template_ext: ""
          - name: Linux arm64
            os: ubuntu-24.04-arm
            folder: linux_arm64
            executable: kinemium
            template_os: linux
            template_arch: arm64
            template_ext: ""
          - name: macOS arm64
            os: macos-15
            folder: macos_arm64
            executable: kinemium
            template_os: macos
            template_arch: arm64
            template_ext: ""
          - name: macOS x86-64
            os: macos-15-intel
            folder: macos_x86-64
            executable: kinemium
            template_os: macos
            template_arch: x86_64
            template_ext: ""
    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --system core.longpaths true
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Verify submodules
        shell: bash
        run: git submodule status --recursive
      - name: Patch odin-http for current Odin
        shell: bash
        run: git -C src/engine/util/odin-http apply "$GITHUB_WORKSPACE/tools/patches/odin-http-odin-latest.patch"
      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: latest
      - name: Show Odin version
        run: odin version
      - name: Verify runner architecture
        shell: bash
        run: |
          case '${{ matrix.template_arch }}:${{ runner.arch }}' in
            x86_64:X64|arm64:ARM64) ;;
            *) echo 'Runner architecture does not match the artifact target' >&2; exit 1 ;;
          esac
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test Skia binary downloader
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p test_fetch_skia.py
      - name: Resolve latest Skia binary
        id: skia
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          arch='${{ matrix.template_arch }}'
          if [[ "$arch" == x86_64 ]]; then arch=x64; fi
          python tools/fetch_skia.py --platform '${{ matrix.template_os }}' --arch "$arch" --resolve-only
      - name: Cache Skia release binary
        uses: actions/cache@v4
        with:
          path: ${{ steps.skia.outputs.path }}
          key: ${{ steps.skia.outputs.cache-key }}
      - name: Download Skia binary with curl
        shell: bash
        run: |
          arch='${{ matrix.template_arch }}'
          if [[ "$arch" == x86_64 ]]; then arch=x64; fi
          python tools/fetch_skia.py --platform '${{ matrix.template_os }}' --arch "$arch"
      - name: Cache remaining native libraries
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            vendor/build/**/*.a
            vendor/build/**/*.lib
            vendor/build/**/*.so*
            vendor/build/**/*.dylib
            vendor/build/lib/*.anchor
          key: native-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.skia.outputs.cache-key }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'vendor/**', 'tools/fetch_skia.py', 'tools/isolate_skia_symbols.py', '.github/workflows/main.yml') }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            git \
            glslc \
            llvm \
            libegl1-mesa-dev \
            libenet-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libgtk-3-dev \
            libibus-1.0-dev \
            libvulkan-dev \
            libc++-dev \
            libc++abi-dev \
            libwayland-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxrender-dev \
            libxss-dev \
            libxtst-dev \
            libxxf86vm-dev \
            libwebkit2gtk-4.1-dev \
            ninja-build
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: brew install cmake enet ninja llvm openssl@3
# The upstream macOS release only contains ARM64 tools and libraries
      - name: Restore Filament SDK (macOS Intel)
        if: runner.os == 'macOS' && runner.arch == 'X64' && steps.native-cache.outputs.cache-hit != 'true'
        id: filament-intel
        uses: actions/cache/restore@v4
        with:
          path: .cache/filament-mac-x64
          key: filament-v1.74.0-macos-x64-v1
      - name: Build Filament SDK (macOS Intel)
        if: runner.os == 'macOS' && runner.arch == 'X64' && steps.native-cache.outputs.cache-hit != 'true' && steps.filament-intel.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sdk="$GITHUB_WORKSPACE/.cache/filament-mac-x64"
          source_dir="$RUNNER_TEMP/filament-v1.74.0"
          git clone --depth 1 --branch v1.74.0 https://github.com/google/filament.git "$source_dir"
          (
            cd "$source_dir"
            export CC="$(xcrun --find clang)"
            export CXX="$(xcrun --find clang++)"
            export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
            bash ./build.sh -i release
          )
          mkdir -p "$(dirname "$sdk")"
          mv "$source_dir/out/release/filament" "$sdk"
      - name: Verify Filament SDK (macOS Intel)
        if: runner.os == 'macOS' && runner.arch == 'X64' && steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sdk="$GITHUB_WORKSPACE/.cache/filament-mac-x64"
          xcrun lipo "$sdk/bin/matc" -verify_arch x86_64
          xcrun lipo "$sdk/bin/resgen" -verify_arch x86_64
          xcrun lipo "$sdk/lib/x86_64/libfilament.a" -verify_arch x86_64
      - name: Save Filament SDK (macOS Intel)
        if: runner.os == 'macOS' && runner.arch == 'X64' && steps.native-cache.outputs.cache-hit != 'true' && steps.filament-intel.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/filament-mac-x64
          key: ${{ steps.filament-intel.outputs.cache-primary-key }}
      - name: Install Vulkan SDK
        if: runner.os != 'Linux'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.304.1
          install_runtime: true
          cache: true
          stripdown: false
      - name: Isolate Skia shader compiler symbols
        shell: bash
        run: python tools/isolate_skia_symbols.py '${{ steps.skia.outputs.path }}'
      - name: Configure and build native dependencies (Windows)
        if: runner.os == 'Windows' && steps.native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw "Visual Studio C++ toolchain was not found" }
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          cmake -S . -B vendor/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPORTABLE=ON -C '${{ steps.skia.outputs.cmake }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build vendor/build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure and build native dependencies (Unix)
        if: runner.os != 'Windows' && steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cmake_platform_args=()
          if [[ "${{ runner.os }}" == 'Linux' ]]; then
            cmake_platform_args+=(
              -DCMAKE_AR=/usr/bin/ar
              -DCMAKE_RANLIB=/usr/bin/ranlib
              -DINTERPROCEDURAL_OPTIMIZATION=OFF
            )
          fi
          cmake_env=(CC=clang CXX=clang++)
          if [[ "${{ runner.os }}" == 'macOS' ]]; then
            cmake_env=(CC="$(xcrun --find clang)" CXX="$(xcrun --find clang++)")
            cmake_env+=(OBJC="$(xcrun --find clang)" OBJCXX="$(xcrun --find clang++)")
            cmake_platform_args+=(-DCMAKE_OSX_SYSROOT="$(xcrun --sdk macosx --show-sdk-path)")
            if [[ "${{ runner.arch }}" == 'X64' ]]; then
              cmake_platform_args+=(-DFILAMENT_DIR="$GITHUB_WORKSPACE/.cache/filament-mac-x64")
            fi
          fi
          env "${cmake_env[@]}" cmake \
            -S . \
            -B vendor/build \
            -G Ninja \
            -C '${{ steps.skia.outputs.cmake }}' \
            -DCMAKE_BUILD_TYPE=Release \
            -DPORTABLE=ON \
            "${cmake_platform_args[@]}"
          for attempt in 1 2 3; do
            if cmake --build vendor/build --config Release --parallel; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            sleep $((30 * attempt))
          done
      - name: Verify native libraries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $required = @(
            'vendor/build/lib/kine_sdl3.lib',
            'vendor/build/lib/kine_filament.lib',
            'vendor/build/lib/kine_skia.lib',
            'vendor/build/lib/kine_vk.lib',
            'vendor/build/lib/kine_jolt.lib',
            'vendor/build/lib/kine_jolt_core.lib',
            'vendor/build/lib/kine_luau.lib',
            'vendor/build/vendor/luau/Luau.Compiler.lib',
            'vendor/build/vendor/luau/Luau.VM.lib',
            'vendor/build/_deps/tracy-build/TracyClient.lib'
          )
          foreach ($library in $required) {
            if (!(Test-Path -LiteralPath $library)) {
              throw "Missing native library: $library"
            }
          }
      - name: Isolate Skia Vulkan allocator (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          skia_lib_dir="$(dirname '${{ steps.skia.outputs.library }}')"
          bash tools/isolate_skia_vma.sh "$skia_lib_dir/libskia.a"
          for module in svg skshaper skunicode_core skunicode_icu; do
            bash tools/isolate_skia_vma.sh "$skia_lib_dir/lib${module}.a" --optional
          done
      - name: Verify native libraries (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          required=(
            vendor/build/lib/KinemiumLibs.a
            vendor/build/lib/kine_luau.a
            vendor/build/vendor/luau/libLuau.Compiler.a
            vendor/build/vendor/luau/libLuau.VM.a
            vendor/build/_deps/tracy-build/libTracyClient.a
          )
          for library in "${required[@]}"; do
            test -f "$library" || { echo "Missing native library: $library"; exit 1; }
          done
          file vendor/build/lib/KinemiumLibs.a
          if [[ "${{ runner.os }}" == 'Linux' ]]; then
            grep -q '^GROUP (' vendor/build/lib/KinemiumLibs.a
            test -f vendor/build/lib/KinemiumLibs.a.anchor
          else
            ar -t vendor/build/lib/KinemiumLibs.a >/dev/null
          fi
          find vendor/build/_deps/sdl3-build -maxdepth 1 -type f \
            \( -name 'libSDL3.so*' -o -name 'libSDL3*.dylib' \) -print -quit \
            | grep -q . || { echo 'Missing shared SDL3 library'; exit 1; }
      - name: Save native libraries before Odin linking
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            vendor/build/**/*.a
            vendor/build/**/*.lib
            vendor/build/**/*.so*
            vendor/build/**/*.dylib
            vendor/build/lib/*.anchor
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Build Odin vendor libraries (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          odin_root="$(odin root)"
          build_odin_vendor_library() {
            local source_dir="$1"
            local script_name="$2"
            if [[ -f "$source_dir/$script_name" ]]; then
              bash "$source_dir/$script_name"
            else
              make -C "$source_dir"
            fi
          }
          build_odin_vendor_library \
            "$odin_root/vendor/miniaudio/src" \
            build_miniaudio.sh
          if [[ "${{ runner.os }}" == 'macOS' ]]; then
            mkdir -p "$odin_root/vendor/stb/lib/darwin"
          fi
          build_odin_vendor_library \
            "$odin_root/vendor/stb/src" \
            build_stb.sh
          bash "$odin_root/vendor/box2d/build_box2d.sh"
      - name: Stage static ENet and OpenSSL libraries (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          enet_archive="$(brew --prefix enet)/lib/libenet.a"
          test -s "$enet_archive"
          cp "$enet_archive" vendor/build/lib/libenet.a
          openssl_lib="$(brew --prefix openssl@3)/lib"
          # odin-http links -lssl.3 and -lcrypto.3 on macOS.
          for library in ssl crypto; do
            archive="$openssl_lib/lib$library.a"
            test -s "$archive"
            cp "$archive" "vendor/build/lib/lib$library.3.a"
          done
      - name: Check Odin source
        run: odin check src
      - name: Build Kinemium (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          New-Item -ItemType Directory -Force "dist/${{ matrix.folder }}" | Out-Null
          $versionDefine = @()
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME
            if ($v.StartsWith('v')) { $v = $v.Substring(1) }
            $versionDefine = @("-define:RUNTIME_VERSION_DISPLAY=$v")
          }
          & odin build src `
            -o:speed `
            -out:"dist/${{ matrix.folder }}/${{ matrix.executable }}" `
            @versionDefine `
            -define:BUILD_TARGET=editor `
            -define:RUNTIME_GIT_ENABLED=true `
            -define:RUNTIME_GIT_COMMIT=$env:GITHUB_SHA `
            -define:RUNTIME_GIT_BRANCH=$env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $odinRoot = "$(odin root)".TrimEnd()
          $sdl3Dll = Join-Path $odinRoot 'vendor/sdl3/SDL3.dll'
          if (!(Test-Path -LiteralPath $sdl3Dll)) {
            throw "SDL3.dll was not found next to the Odin SDK: $sdl3Dll"
          }
          Copy-Item -LiteralPath $sdl3Dll -Destination "dist/${{ matrix.folder }}/SDL3.dll"
          $flavor_ext = "${{ matrix.template_ext }}"
          foreach ($flavor in @('server', 'client')) {
            & odin build src `
              -o:speed `
              -out:"dist/${{ matrix.folder }}/kinemium-$flavor-${{ matrix.template_os }}-${{ matrix.template_arch }}$flavor_ext" `
              @versionDefine `
              -define:BUILD_TARGET=$flavor `
              -define:RUNTIME_GIT_ENABLED=true `
              -define:RUNTIME_GIT_COMMIT=$env:GITHUB_SHA `
              -define:RUNTIME_GIT_BRANCH=$env:GITHUB_REF_NAME
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build Kinemium debug (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw "Visual Studio C++ toolchain was not found" }
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          New-Item -ItemType Directory -Force "dist-debug/${{ matrix.folder }}" | Out-Null
          $versionDefine = @()
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME
            if ($v.StartsWith('v')) { $v = $v.Substring(1) }
            $versionDefine = @("-define:RUNTIME_VERSION_DISPLAY=$v")
          }
          & odin build src `
            -debug `
            -o:none `
            -out:"dist-debug/${{ matrix.folder }}/${{ matrix.executable }}" `
            @versionDefine `
            -define:BUILD_TARGET=editor `
            -define:RUNTIME_GIT_ENABLED=true `
            -define:RUNTIME_GIT_COMMIT=$env:GITHUB_SHA `
            -define:RUNTIME_GIT_BRANCH=$env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath "dist/${{ matrix.folder }}/SDL3.dll" -Destination "dist-debug/${{ matrix.folder }}/SDL3.dll"
          Get-ChildItem -LiteralPath "dist-debug/${{ matrix.folder }}"
      - name: Build Kinemium (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.folder }}"
          webview_link_flags="$(pkg-config --libs gtk+-3.0 webkit2gtk-4.1)"
          version_define=()
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            version_define=("-define:RUNTIME_VERSION_DISPLAY=${GITHUB_REF_NAME#v}")
          fi
          odin build src \
            -o:speed \
            -out:"dist/${{ matrix.folder }}/${{ matrix.executable }}" \
            "${version_define[@]}" \
            -define:BUILD_TARGET=editor \
            -define:RUNTIME_GIT_ENABLED=true \
            -define:RUNTIME_GIT_COMMIT="$GITHUB_SHA" \
            -define:RUNTIME_GIT_BRANCH="$GITHUB_REF_NAME" \
            -extra-linker-flags:"-L${PWD}/vendor/build/lib -L${PWD}/vendor/build/_deps/sdl3-build -Wl,-rpath,\$ORIGIN -Wl,-z,noexecstack -lstdc++ -lc++ -lc++abi -lfontconfig -lfreetype -lEGL $webview_link_flags"
          cp -a vendor/build/_deps/sdl3-build/libSDL3.so* "dist/${{ matrix.folder }}/"
          for soname in libenet.so.7 libvulkan.so.1 libc++.so.1 libc++abi.so.1 libunwind.so.1; do
            source_path="$(ldconfig -p | awk -v name="$soname" '$1 == name && !path { path = $NF } END { print path }')"
            test -n "$source_path" && test -f "$source_path" || {
              echo "Missing Linux runtime library: $soname" >&2
              exit 1
            }
            cp -L "$source_path" "dist/${{ matrix.folder }}/$soname"
          done
          ext="${{ matrix.template_ext }}"
          for flavor in server client; do
            odin build src \
              -o:speed \
              -out:"dist/${{ matrix.folder }}/kinemium-${flavor}-${{ matrix.template_os }}-${{ matrix.template_arch }}${ext}" \
              "${version_define[@]}" \
              -define:BUILD_TARGET="$flavor" \
              -define:RUNTIME_GIT_ENABLED=true \
              -define:RUNTIME_GIT_COMMIT="$GITHUB_SHA" \
              -define:RUNTIME_GIT_BRANCH="$GITHUB_REF_NAME" \
              -extra-linker-flags:"-L${PWD}/vendor/build/lib -L${PWD}/vendor/build/_deps/sdl3-build -Wl,-rpath,\$ORIGIN -Wl,-z,noexecstack -lstdc++ -lc++ -lc++abi -lfontconfig -lfreetype -lEGL $webview_link_flags"
            if [[ $? -ne 0 ]]; then exit 1; fi
          done
          chmod +x "dist/${{ matrix.folder }}/kinemium-server-${{ matrix.template_os }}-${{ matrix.template_arch }}${ext}" \
                   "dist/${{ matrix.folder }}/kinemium-client-${{ matrix.template_os }}-${{ matrix.template_arch }}${ext}"
      - name: Build Kinemium debug (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist-debug/${{ matrix.folder }}"
          webview_link_flags="$(pkg-config --libs gtk+-3.0 webkit2gtk-4.1)"
          version_define=()
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            version_define=("-define:RUNTIME_VERSION_DISPLAY=${GITHUB_REF_NAME#v}")
          fi
          odin build src \
            -debug \
            -o:none \
            -out:"dist-debug/${{ matrix.folder }}/${{ matrix.executable }}" \
            "${version_define[@]}" \
            -define:BUILD_TARGET=editor \
            -define:RUNTIME_GIT_ENABLED=true \
            -define:RUNTIME_GIT_COMMIT="$GITHUB_SHA" \
            -define:RUNTIME_GIT_BRANCH="$GITHUB_REF_NAME" \
            -extra-linker-flags:"-L${PWD}/vendor/build/lib -L${PWD}/vendor/build/_deps/sdl3-build -Wl,-rpath,\$ORIGIN -Wl,-z,noexecstack -lstdc++ -lc++ -lc++abi -lfontconfig -lfreetype -lEGL $webview_link_flags"
          cp -a "dist/${{ matrix.folder }}"/lib*.so* "dist-debug/${{ matrix.folder }}/"
          chmod +x "dist-debug/${{ matrix.folder }}/${{ matrix.executable }}"
          file "dist-debug/${{ matrix.folder }}/${{ matrix.executable }}"
          readelf -W -S "dist-debug/${{ matrix.folder }}/${{ matrix.executable }}" | grep -F '.debug_info'
      - name: Build Kinemium (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.folder }}"
          version_define=()
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            version_define=("-define:RUNTIME_VERSION_DISPLAY=${GITHUB_REF_NAME#v}")
          fi
          odin build src \
            -o:speed \
            -out:"dist/${{ matrix.folder }}/${{ matrix.executable }}" \
            "${version_define[@]}" \
            -define:BUILD_TARGET=editor \
            -define:RUNTIME_GIT_ENABLED=true \
            -define:RUNTIME_GIT_COMMIT="$GITHUB_SHA" \
            -define:RUNTIME_GIT_BRANCH="$GITHUB_REF_NAME" \
            -extra-linker-flags:"-L${PWD}/vendor/build/lib -L${PWD}/vendor/build/_deps/sdl3-build -L${VULKAN_SDK}/lib -Wl,-rpath,@loader_path"
          cp -a vendor/build/_deps/sdl3-build/libSDL3*.dylib "dist/${{ matrix.folder }}/"
          cp -a "${VULKAN_SDK}"/lib/libvulkan*.dylib "dist/${{ matrix.folder }}/"
          ext="${{ matrix.template_ext }}"
          for flavor in server client; do
            odin build src \
              -o:speed \
              -out:"dist/${{ matrix.folder }}/kinemium-${flavor}-${{ matrix.template_os }}-${{ matrix.template_arch }}${ext}" \
              "${version_define[@]}" \
              -define:BUILD_TARGET="$flavor" \
              -define:RUNTIME_GIT_ENABLED=true \
              -define:RUNTIME_GIT_COMMIT="$GITHUB_SHA" \
              -define:RUNTIME_GIT_BRANCH="$GITHUB_REF_NAME" \
              -extra-linker-flags:"-L${PWD}/vendor/build/lib -L${PWD}/vendor/build/_deps/sdl3-build -L${VULKAN_SDK}/lib -Wl,-rpath,@loader_path"
            if [[ $? -ne 0 ]]; then exit 1; fi
          done
      - name: Build Kinemium debug (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist-debug/${{ matrix.folder }}"
          version_define=()
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            version_define=("-define:RUNTIME_VERSION_DISPLAY=${GITHUB_REF_NAME#v}")
          fi
          odin build src \
            -debug \
            -o:none \
            -out:"dist-debug/${{ matrix.folder }}/${{ matrix.executable }}" \
            "${version_define[@]}" \
            -define:BUILD_TARGET=editor \
            -define:RUNTIME_GIT_ENABLED=true \
            -define:RUNTIME_GIT_COMMIT="$GITHUB_SHA" \
            -define:RUNTIME_GIT_BRANCH="$GITHUB_REF_NAME" \
            -extra-linker-flags:"-L${PWD}/vendor/build/lib -L${PWD}/vendor/build/_deps/sdl3-build -L${VULKAN_SDK}/lib -Wl,-rpath,@loader_path"
          cp -a "dist/${{ matrix.folder }}"/lib*.dylib "dist-debug/${{ matrix.folder }}/"
          chmod +x "dist-debug/${{ matrix.folder }}/${{ matrix.executable }}"
          file "dist-debug/${{ matrix.folder }}/${{ matrix.executable }}"
      - name: Strip Linux executables
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd "dist/${{ matrix.folder }}"
          ext="${{ matrix.template_ext }}"
          ls -lh kinemium "kinemium-server-${{ matrix.template_os }}-${{ matrix.template_arch }}${ext}" "kinemium-client-${{ matrix.template_os }}-${{ matrix.template_arch }}${ext}"
          for f in kinemium "kinemium-server-${{ matrix.template_os }}-${{ matrix.template_arch }}${ext}" "kinemium-client-${{ matrix.template_os }}-${{ matrix.template_arch }}${ext}"; do
            strip --strip-unneeded "$f"
          done
          ls -lh kinemium "kinemium-server-${{ matrix.template_os }}-${{ matrix.template_arch }}${ext}" "kinemium-client-${{ matrix.template_os }}-${{ matrix.template_arch }}${ext}"
      - name: Inspect Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          file "dist/${{ matrix.folder }}/${{ matrix.executable }}"
          ldd "dist/${{ matrix.folder }}/${{ matrix.executable }}"
          ! ldd "dist/${{ matrix.folder }}/${{ matrix.executable }}" | grep -q 'not found'
          readelf -W -l "dist/${{ matrix.folder }}/${{ matrix.executable }}" | grep GNU_STACK
          ! readelf -W -l "dist/${{ matrix.folder }}/${{ matrix.executable }}" \
            | grep GNU_STACK | grep -q RWE
      - name: Inspect macOS executable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          file "dist/${{ matrix.folder }}/${{ matrix.executable }}"
          otool -L "dist/${{ matrix.folder }}/${{ matrix.executable }}"
      - name: Inspect Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path -LiteralPath "dist/${{ matrix.folder }}/${{ matrix.executable }}")) {
            throw 'Kinemium executable was not created'
          }
          if (!(Test-Path -LiteralPath "dist/${{ matrix.folder }}/SDL3.dll")) {
            throw 'SDL3.dll was not copied next to the executable'
          }
      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.folder }}
          path: dist/${{ matrix.folder }}
          if-no-files-found: error
      - name: Upload debug artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.folder }}-debug
          path: dist-debug/${{ matrix.folder }}
          if-no-files-found: error
  web:
    name: Web (WASM)
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Enable Windows long paths
        shell: pwsh
        run: git config --system core.longpaths true
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: latest
      - name: Install Emscripten
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath '.tools/emsdk')) {
            git clone https://github.com/emscripten-core/emsdk.git .tools/emsdk
          }
          & './.tools/emsdk/emsdk.bat' install latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & './.tools/emsdk/emsdk.bat' activate latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Filament material compiler (matc)
        shell: pwsh
        run: |
          $toolDir = '.cache/filament-matc'
          $archive = Join-Path $toolDir 'filament-v1.74.0-windows.tgz'
          New-Item -ItemType Directory -Force $toolDir | Out-Null
          if (!(Test-Path -LiteralPath $archive)) {
            curl.exe --fail --location --retry 4 --output $archive 'https://github.com/google/filament/releases/download/v1.74.0/filament-v1.74.0-windows.tgz'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          tar -xzf $archive -C $toolDir
          $matc = Join-Path $toolDir 'bin/matc.exe'
          if (!(Test-Path -LiteralPath $matc)) {
            throw "matc was not found at $matc"
          }
          Write-Output "FILAMENT_MATC=$matc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Check Web Odin source
        run: odin check src -target:js_wasm32
      - name: Build Kinemium Web (WASM)
        shell: pwsh
        run: |
          & './tools/build_wasm.ps1'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path -LiteralPath 'build/web/kinemium_engine.wasm')) {
            throw 'kinemium_engine.wasm was not built'
          }
      - name: Upload web artifact
        uses: actions/upload-artifact@v6
        with:
          name: web
          path: build/web
          if-no-files-found: error
  android:
    name: Android (arm64 + x86-64)
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Enable Windows long paths
        shell: pwsh
        run: git config --system core.longpaths true
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Patch odin-http for current Odin
        shell: pwsh
        run: |
          $patch = Join-Path $env:GITHUB_WORKSPACE 'tools/patches/odin-http-odin-latest.patch'
          git -C src/engine/util/odin-http apply $patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: latest
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Resolve latest Android Skia binaries
        id: skia_android
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/fetch_skia.py --platform android --arch arm64 --resolve-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/fetch_skia.py --platform android --arch x64 --resolve-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $arm = Get-Content .cache/skia/android-arm64-release.json -Raw | ConvertFrom-Json
          $x64 = Get-Content .cache/skia/android-x64-release.json -Raw | ConvertFrom-Json
          "cache-key=skia-android-$($arm.digest.Substring(7))-$($x64.digest.Substring(7))" >> $env:GITHUB_OUTPUT
      - name: Cache Android Skia binaries
        uses: actions/cache@v4
        with:
          path: |
            .cache/skia/android-arm64
            .cache/skia/android-x64
          key: ${{ steps.skia_android.outputs.cache-key }}
      - name: Download Android Skia binaries with curl
        shell: pwsh
        run: |
          python tools/fetch_skia.py --platform android --arch arm64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/fetch_skia.py --platform android --arch x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/isolate_skia_symbols.py .cache/skia/android-arm64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/isolate_skia_symbols.py .cache/skia/android-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Cache Android dependency downloads
        id: android-deps
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/android
            build/vcpkg-binary-cache
            build/vcpkg-installed
          key: android-deps-v1-${{ runner.os }}-${{ hashFiles('tools/build_android.ps1') }}
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.304.1
          install_runtime: true
          cache: true
          stripdown: false
      - name: Install Android SDK components
        shell: pwsh
        run: |
          if (-not $env:ANDROID_HOME) { throw 'ANDROID_HOME is not set' }
          $licensesDir = Join-Path $env:ANDROID_HOME 'licenses'
          New-Item -ItemType Directory -Force $licensesDir | Out-Null
          Set-Content -Path (Join-Path $licensesDir 'android-sdk-license') -Value '24333f8a63b6825ea9c5514f83c2829b004d1fee' -NoNewline
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
          if (!(Test-Path -LiteralPath $sdkmanager)) {
            throw "sdkmanager was not found at $sdkmanager"
          }
          & $sdkmanager --install 'ndk;30.0.16248370' 'platforms;android-36'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path -LiteralPath (Join-Path $env:ANDROID_HOME 'ndk/30.0.16248370/build/cmake/android.toolchain.cmake'))) {
            throw 'Android NDK 30.0.16248370 was not installed'
          }
      - name: Prepare Android dependency packages
        shell: pwsh
        run: |
          $binaryCache = Join-Path $PWD 'build/vcpkg-binary-cache'
          New-Item -ItemType Directory -Force $binaryCache | Out-Null
          $env:VCPKG_BINARY_SOURCES = "clear;files,$binaryCache,readwrite"
          & './tools/build_android.ps1' -UsePrebuiltSkia -PrepareOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save Android packages before native compilation
        if: steps.android-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/android
            build/vcpkg-binary-cache
            build/vcpkg-installed
          key: ${{ steps.android-deps.outputs.cache-primary-key }}
      - name: Build Kinemium Android (APK)
        shell: pwsh
        run: |
          try {
            $binaryCache = Join-Path $PWD 'build/vcpkg-binary-cache'
            New-Item -ItemType Directory -Force $binaryCache | Out-Null
            $env:VCPKG_BINARY_SOURCES = "clear;files,$binaryCache,readwrite"
            & './tools/build_android.ps1' -UsePrebuiltSkia
            if ($LASTEXITCODE -ne 0) { throw "build_android.ps1 exited with code $LASTEXITCODE" }
          } catch {
            Write-Error $_
            exit 1
          }
          if (!(Test-Path -LiteralPath 'android/app/build/outputs/apk/debug/app-debug.apk')) {
            throw 'app-debug.apk was not created'
          }
      - name: Upload Android artifact
        uses: actions/upload-artifact@v6
        with:
          name: android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, web, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Download Windows x86-64 artifact
        uses: actions/download-artifact@v6
        with:
          name: windows_x86-64
          path: release/windows_x86-64
      - name: Download Linux x86-64 artifact
        uses: actions/download-artifact@v6
        with:
          name: linux_x86-64
          path: release/linux_x86-64
      - name: Download Linux arm64 artifact
        uses: actions/download-artifact@v6
        with:
          name: linux_arm64
          path: release/linux_arm64
      - name: Download macOS arm64 artifact
        uses: actions/download-artifact@v6
        with:
          name: macos_arm64
          path: release/macos_arm64
      - name: Download macOS x86-64 artifact
        uses: actions/download-artifact@v6
        with:
          name: macos_x86-64
          path: release/macos_x86-64
      - name: Download web artifact
        uses: actions/download-artifact@v6
        with:
          name: web
          path: release/web
      - name: Download android artifact
        uses: actions/download-artifact@v6
        with:
          name: android
          path: release/android
      - name: Create executable archives
        shell: bash
        run: |
          mkdir -p release/archives
          platforms=(
            "windows_x86-64 windows x86_64 .exe"
            "linux_x86-64 linux x86_64"
            "linux_arm64 linux arm64"
            "macos_arm64 macos arm64"
            "macos_x86-64 macos x86_64"
          )
          for spec in "${platforms[@]}"; do
            read -r folder os arch ext <<< "$spec"
            src="release/$folder"
            stage="$(mktemp -d "release/.package-$folder.XXXXXX")"
            trap 'rm -rf "$stage"' EXIT
            exe="kinemium"
            if [[ "$os" == "windows" ]]; then exe="kinemium.exe"; fi
            mkdir -p "$stage/kinemium"
            cp "$src/$exe" "$stage/kinemium/"
            case "$os" in
              windows) cp "$src/SDL3.dll" "$stage/kinemium/" ;;
              linux) cp "$src"/libSDL3.so* "$src"/libenet.so* "$src"/libvulkan.so* \
                       "$src"/libc++.so.1 "$src"/libc++abi.so.1 "$src"/libunwind.so.1 \
                       "$stage/kinemium/" ;;
              macos) cp "$src"/libSDL3*.dylib "$src"/libvulkan*.dylib "$stage/kinemium/" ;;
            esac
            if [[ "$os" != "windows" ]]; then chmod +x "$stage/kinemium/$exe"; fi
            (cd "$stage/kinemium" && zip -r "../../archives/kinemium-${os}-${arch}.zip" .)
            server="kinemium-server-${os}-${arch}${ext}"
            mkdir -p "$stage/kinemium-server"
            cp "$src/$server" "$stage/kinemium-server/"
            case "$os" in
              windows) cp "$src/SDL3.dll" "$stage/kinemium-server/" ;;
              linux) cp "$src"/libSDL3.so* "$src"/libenet.so* "$src"/libvulkan.so* \
                       "$src"/libc++.so.1 "$src"/libc++abi.so.1 "$src"/libunwind.so.1 \
                       "$stage/kinemium-server/" ;;
              macos) cp "$src"/libSDL3*.dylib "$src"/libvulkan*.dylib "$stage/kinemium-server/" ;;
            esac
            if [[ "$os" != "windows" ]]; then chmod +x "$stage/kinemium-server/$server"; fi
            (cd "$stage/kinemium-server" && zip -r "../../archives/kinemium-server-${os}-${arch}${ext}.zip" .)
            client="kinemium-client-${os}-${arch}${ext}"
            mkdir -p "$stage/kinemium-client"
            cp "$src/$client" "$stage/kinemium-client/"
            case "$os" in
              windows) cp "$src/SDL3.dll" "$stage/kinemium-client/" ;;
              linux) cp "$src"/libSDL3.so* "$src"/libenet.so* "$src"/libvulkan.so* \
                       "$src"/libc++.so.1 "$src"/libc++abi.so.1 "$src"/libunwind.so.1 \
                       "$stage/kinemium-client/" ;;
              macos) cp "$src"/libSDL3*.dylib "$src"/libvulkan*.dylib "$stage/kinemium-client/" ;;
            esac
            if [[ "$os" != "windows" ]]; then chmod +x "$stage/kinemium-client/$client"; fi
            (cd "$stage/kinemium-client" && zip -r "../../archives/kinemium-client-${os}-${arch}${ext}.zip" .)
            rm -rf "$stage"
            trap - EXIT
          done
          # Web (WASM)
          if [[ -d release/web ]]; then
            (cd release/web && zip -r ../archives/kinemium-web.zip .)
          fi
          # Android APK
          if [[ -f release/android/app-debug.apk ]]; then
            cp release/android/app-debug.apk release/archives/kinemium-android.apk
          fi
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            release/archives/*.zip \
            release/archives/*.apk \
            --generate-notes
