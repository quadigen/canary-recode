name: Build Kinemium Engine

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86-64
            os: windows-latest
            folder: windows_x86-64
            executable: kinemium.exe
          - name: macOS arm64
            os: macos-15
            folder: macos_arm64
            executable: kinemium
          - name: Linux x86-64
            os: ubuntu-24.04
            folder: linux_x86-64
            executable: kinemium

    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Verify submodules
        shell: bash
        run: git submodule status --recursive

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: latest

      - name: Show Odin version
        run: odin version

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            git \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libgtk-3-dev \
            libibus-1.0-dev \
            libc++-dev \
            libc++abi-dev \
            libwayland-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxrender-dev \
            libxss-dev \
            libxtst-dev \
            libxxf86vm-dev \
            ninja-build

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: brew install cmake ninja

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.304.1
          install_runtime: true
          cache: true
          stripdown: false

      - name: Configure and build native dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw "Visual Studio C++ toolchain was not found" }

          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'

          cmake -S . -B vendor/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build vendor/build --config Release --parallel

      - name: Configure and build native dependencies (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          CC=clang CXX=clang++ CXXFLAGS=-stdlib=libc++ cmake \
            -S . \
            -B vendor/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build vendor/build --config Release --parallel

      - name: Verify native libraries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $required = @(
            'vendor/build/lib/kine_sdl3.lib',
            'vendor/build/lib/kine_filament.lib',
            'vendor/build/lib/kine_skia.lib',
            'vendor/build/lib/kine_vk.lib',
            'vendor/build/lib/kine_jolt.lib',
            'vendor/build/lib/kine_luau.lib',
            'vendor/build/vendor/luau/Luau.Compiler.lib',
            'vendor/build/vendor/luau/Luau.VM.lib'
          )
          foreach ($library in $required) {
            if (!(Test-Path -LiteralPath $library)) {
              throw "Missing native library: $library"
            }
          }

      - name: Verify native libraries (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          required=(
            vendor/build/lib/KinemiumLibs.a
            vendor/build/lib/kine_luau.a
            vendor/build/vendor/luau/libLuau.Compiler.a
            vendor/build/vendor/luau/libLuau.VM.a
          )
          for library in "${required[@]}"; do
            test -f "$library" || { echo "Missing native library: $library"; exit 1; }
          done
          find vendor/build/_deps/sdl3-build -maxdepth 1 -type f \
            \( -name 'libSDL3.so*' -o -name 'libSDL3*.dylib' \) -print -quit \
            | grep -q . || { echo 'Missing shared SDL3 library'; exit 1; }

      - name: Build Odin vendor libraries (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          odin_root="$(odin root)"

          build_odin_vendor_library() {
            local source_dir="$1"
            local script_name="$2"
            if [[ -f "$source_dir/$script_name" ]]; then
              bash "$source_dir/$script_name"
            else
              make -C "$source_dir"
            fi
          }

          build_odin_vendor_library \
            "$odin_root/vendor/miniaudio/src" \
            build_miniaudio.sh

          if [[ "${{ runner.os }}" == 'macOS' ]]; then
            mkdir -p "$odin_root/vendor/stb/lib/darwin"
          fi
          build_odin_vendor_library \
            "$odin_root/vendor/stb/src" \
            build_stb.sh

          bash "$odin_root/vendor/box2d/build_box2d.sh"

      - name: Check Odin source
        run: odin check src

      - name: Build Kinemium (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'

          New-Item -ItemType Directory -Force 'dist/${{ matrix.folder }}' | Out-Null
          odin build src -o:speed -out:'dist/${{ matrix.folder }}/${{ matrix.executable }}'

      - name: Build Kinemium (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p 'dist/${{ matrix.folder }}'
          odin build src \
            -o:speed \
            -out:'dist/${{ matrix.folder }}/${{ matrix.executable }}' \
            -extra-linker-flags:"-L${PWD}/vendor/build/_deps/sdl3-build -Wl,-rpath,\$ORIGIN"
          cp -a vendor/build/_deps/sdl3-build/libSDL3.so* 'dist/${{ matrix.folder }}/'

      - name: Build Kinemium (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p 'dist/${{ matrix.folder }}'
          odin build src \
            -o:speed \
            -out:'dist/${{ matrix.folder }}/${{ matrix.executable }}' \
            -extra-linker-flags:"-L${PWD}/vendor/build/_deps/sdl3-build -Wl,-rpath,@loader_path"
          cp -a vendor/build/_deps/sdl3-build/libSDL3*.dylib 'dist/${{ matrix.folder }}/'

      - name: Inspect Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          file 'dist/${{ matrix.folder }}/${{ matrix.executable }}'
          ldd 'dist/${{ matrix.folder }}/${{ matrix.executable }}'
          ! readelf -W -l 'dist/${{ matrix.folder }}/${{ matrix.executable }}' \
            | grep GNU_STACK | grep -q RWE

      - name: Inspect macOS executable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          file 'dist/${{ matrix.folder }}/${{ matrix.executable }}'
          otool -L 'dist/${{ matrix.folder }}/${{ matrix.executable }}'

      - name: Inspect Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path -LiteralPath 'dist/${{ matrix.folder }}/${{ matrix.executable }}')) {
            throw 'Kinemium executable was not created'
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.folder }}
          path: dist/${{ matrix.folder }}
          if-no-files-found: error
